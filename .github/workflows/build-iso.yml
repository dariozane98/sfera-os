# Crea il file ISO installabile di Sfera OS.
# Si avvia a mano: scheda "Actions" → "Crea ISO di Sfera OS" → "Run workflow".
# Richiede che "Costruisci Sfera OS" sia già terminato con successo.
name: Crea ISO di Sfera OS

on:
  workflow_dispatch:

env:
  IMAGE_NAME: sfera-os

jobs:
  iso:
    name: Creazione del file ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Libera spazio sul disco del server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          df -h /

      - name: Scarica i file del progetto
        uses: actions/checkout@v4

      - name: Prepara il nome dell'immagine
        run: echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:latest" >> "$GITHUB_ENV"

      - name: Inserisci l'indirizzo degli aggiornamenti nella configurazione
        run: sed -i "s|__IMAGE_REF__|${IMAGE_REF}|g" disk_config/iso.toml

      - name: Scarica l'immagine del sistema
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "${IMAGE_REF}"

      - name: Crea il file ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD/disk_config/iso.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            "${IMAGE_REF}"
          sudo chown -R "$(id -u):$(id -g)" output
          mv output/bootiso/install.iso output/sfera-os.iso
          ls -lh output

      - name: Rendi disponibile il file ISO
        uses: actions/upload-artifact@v4
        with:
          name: sfera-os-iso
          path: output/sfera-os.iso
          retention-days: 7
          compression-level: 0
